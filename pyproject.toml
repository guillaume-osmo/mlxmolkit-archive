[build-system]
requires = ["setuptools>=64", "wheel", "numpy>=1.24.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlxmolkit-rdkit"
version = "0.4.0"
description = "GPU-accelerated molecular toolkit on Apple Silicon: conformer generation (ETKDG + MMFF94) and Butina clustering via Metal/MLX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Guillaume Osmo"},
]
keywords = ["molecular", "conformer", "ETKDG", "MMFF94", "clustering", "Tanimoto", "Butina", "MLX", "Metal", "Apple Silicon", "GPU"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # 0.31.2 floor: before it, `import mlx.core` seeded a default RNG key, which
    # constructed an array, an allocator, a Metal device, and finally loaded the
    # 122 MB mlx.metallib — so any process importing mlx paid for the GPU
    # whether or not it wanted it. Concurrent processes then contend on that
    # archive: fourteen workers took 3.48 s against 0.18 s for numpy on an
    # M4 Pro / macOS 26.6.1, which made a process pool slower than not using
    # one. ml-explore/mlx#3278 made the key lazy; on 0.32.0 `vmmap` shows the
    # GPU driver is no longer mapped at import and the same test takes ~0.7 s.
    #
    # Not the OS: this reproduces identically on macOS 26.2 and 26.6.1. See
    # experiments/mlx_import_contention/ for the measurements, and
    # ml-explore/mlx#4268 for the upstream thread.
    "mlx>=0.31.2",
    # numpy 2 floor: the compiled extensions in the scientific stack are built
    # against a specific numpy ABI, and mixing a numpy-1-era wheel with a
    # numpy-2 runtime fails at import with "numpy.dtype size changed", which
    # aborts pytest at collection rather than failing one test.
    "numpy>=2.0",
]

[project.optional-dependencies]
rdkit = ["rdkit"]
# numba stays optional at runtime — every call site is guarded and falls back
# to the NumPy path — but when it is installed the floor is 0.67. numba 0.60
# pins numpy<2.1 and cannot import under the numpy>=2.0 this package requires
# once the environment moves past 2.0; 0.67 allows numpy<2.6.
#
# Only `_generate_rotation_matrix_kernel` is live. `_w_withquaternion_kernel`
# is disabled at `_W_KERNEL_ENABLED` because it returns wrong d-orbital
# integrals — silently, and not as a JIT artifact: it fails identically under
# NUMBA_DISABLE_JIT=1 (CSC -786.50 against the correct -501.09). Do not
# re-enable it without the exactness check in tests/test_numba_w_kernel.py.
jit = ["numba>=0.67"]
# scikit-image supplies marching cubes for connolly.py and surface.py. 0.25 is
# the first release built against numpy 2; 0.22 imports fine under numpy 1 and
# raises a binary-incompatibility ValueError under numpy 2.
surface = ["scikit-image>=0.25"]
test = [
    "pytest",
    "rdkit",
    "scikit-image>=0.25",
    # numba is optional at runtime (guarded by try/except with a no-op njit
    # fallback), but if it IS installed it imports coverage itself: numba
    # 0.65 does `class NumbaTracer(coverage.types.Tracer)`, and
    # coverage.types.Tracer only exists from coverage 7.6. With coverage 7.4
    # that is a collection-time crash for the whole suite — 128 failures on a
    # clean clone — and `-p no:cov` does not help because pytest-cov is not
    # what pulls coverage in.
    "coverage>=7.6",
    # Run the suite with the JIT path live. The wrong-d-orbital-integral bug
    # (#72) was invisible here for a whole campaign and surfaced only on a
    # second machine that happened to have numba installed.
    "numba>=0.67",
]
all = ["rdkit", "scikit-image>=0.25", "numba>=0.67"]

[project.urls]
Homepage = "https://github.com/guillaume-osmo/mlxmolkit"
Repository = "https://github.com/guillaume-osmo/mlxmolkit"
Issues = "https://github.com/guillaume-osmo/mlxmolkit/issues"

[tool.setuptools.packages.find]
include = ["mlxmolkit", "mlxmolkit.*", "opencheese", "opencheese.*"]

[tool.setuptools.package-data]
# These globs are relative to mlxmolkit/. They pointed at rm1/, which was
# renamed to nddo/ in 6980e77 — so every glob but *.metal matched nothing and
# the built wheel shipped 45 nddo modules with zero parameter files. Nothing
# caught it because the tests run from the source tree, where the data is
# present regardless of packaging.
mlxmolkit = [
    "*.metal",
    "nddo/data/*.csv",
    "nddo/data/*.npz",
    # riYY_table.json sits at nddo/ level, not under nddo/data/ — the old
    # "rm1/*.json" glob was for exactly this file.
    "nddo/*.json",
    "data/bcc/*.json",
    # g-xtb / GFN parameter tables, added with mlxmolkit/xtb/.
    "xtb/params/*.npz",
    "xtb/params/gfn0/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
